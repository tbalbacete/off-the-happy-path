<!doctype html>
<!--
  Source for public/og.png, the shared Open Graph image (1200x630).
  To regenerate: open this file in headless Chrome at a 1200x630 viewport,
  device scale factor 1, and screenshot the viewport to public/og.png.
  Fonts load from node_modules (@fontsource), so run `npm ci` first.
  Five colors only (docs/plan.md §6): no gradients, shadows or photos.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Source Serif 4 Variable';
        font-style: italic;
        font-weight: 200 900;
        src: url('../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-italic.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
      }

      :root {
        --paper: #f2f2ee;
        --ink: #111111;
        --pencil: #55534d;
        --pen: #b3190f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
      }
      .frame {
        position: absolute;
        inset: 32px;
        border: 2px solid var(--ink);
        padding: 56px 64px 40px;
        display: flex;
        flex-direction: column;
      }
      .name-row {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      .mark {
        flex: none;
        width: 132px;
        height: 132px;
        border: 3px solid var(--ink);
        padding: 11px 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Archivo Variable', sans-serif;
        font-stretch: 72%;
        font-weight: 900;
        font-size: 41px;
        line-height: 0.85;
      }
      .mark .period {
        color: var(--pen);
      }
      .name {
        margin: 0;
        font-family: 'Archivo Variable', sans-serif;
        font-stretch: 72%;
        font-weight: 900;
        font-size: 92px;
        line-height: 0.88;
        text-transform: uppercase;
      }
      .tagline {
        margin: 44px 0 0;
        max-width: 860px;
        font-family: 'Source Serif 4 Variable', Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 31px;
        line-height: 1.38;
      }
      .foot {
        margin-top: auto;
        padding-top: 14px;
        border-top: 2px solid var(--ink);
        display: flex;
        justify-content: space-between;
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--pencil);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="name-row">
        <div class="mark" aria-hidden="true"><span>OT</span><span>HP<span class="period">.</span></span></div>
        <h1 class="name">Off the<br />Happy Path</h1>
      </div>
      <p class="tagline">
        Notes on software engineering as it actually goes: vague tickets, legacy code, interviews, meetings, and the
        occasional thing that worked the first time.
      </p>
      <div class="foot"><span>Tony Albacete</span><span>off-the-happy-path.vercel.app</span></div>
    </div>
  </body>
</html>
